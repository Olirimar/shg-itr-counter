<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>SHG Counter V2</title><style>html,body{margin:0;height:100%;overflow:hidden}body{font-family:Arial}#c{display:flex;height:100vh}#s,#p{flex:1}#s{background:#009150}#p{background:#F26A21}#flash{position:fixed;inset:0;background:#fff;display:none;z-index:99}#admin{position:fixed;inset:0;background:#fff;padding:20px;display:none;z-index:100}</style></head><body><div id="c"><div id="s"></div><div id="p"></div></div><div id="flash"></div><div id="admin"></div><script>var KEY='shgdata';function g(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}function save(o){var d=g();d.push(o);localStorage.setItem(KEY,JSON.stringify(d))}function f(){var x=document.getElementById('flash');x.style.display='block';setTimeout(function(){x.style.display='none'},150)}setTimeout(f,120);function rec(cat,inti){save({timestamp:new Date().toISOString(),category:cat,interesting:inti?'Yes':'No'});if(inti)f()}function bind(id,cat){var el=document.getElementById(id),t=null,longp=false;el.addEventListener('touchstart',function(e){e.preventDefault();longp=false;t=setTimeout(function(){longp=true;rec(cat,true)},300)},{passive:false});el.addEventListener('touchend',function(e){e.preventDefault();if(t)clearTimeout(t);if(!longp)rec(cat,false)},{passive:false});}bind('s','Student');bind('p','Professional');var left=false,right=false,adm=null;function stop(){if(adm)clearTimeout(adm)}function check(){if(left&&right){adm=setTimeout(showAdmin,3000)}}document.getElementById('s').addEventListener('touchstart',function(){left=true;check()});document.getElementById('s').addEventListener('touchend',function(){left=false;stop()});document.getElementById('p').addEventListener('touchstart',function(){right=true;check()});document.getElementById('p').addEventListener('touchend',function(){right=false;stop()});function showAdmin(){var d=g(),st=0,pr=0,ist=0,ipr=0;for(var i=0;i<d.length;i++){if(d[i].category==='Student'){st++;if(d[i].interesting==='Yes')ist++;}else{pr++;if(d[i].interesting==='Yes')ipr++;}}document.getElementById('admin').innerHTML='<h2>SHG Statistics</h2><p>Students: '+st+'</p><p>Professionals: '+pr+'</p><p>Interesting Students: '+ist+'</p><p>Interesting Professionals: '+ipr+'</p><p>Total Visitors: '+d.length+'</p><p>Total Interesting: '+(ist+ipr)+'</p><button onclick="exportCSV()">Export CSV</button> <button onclick="closeAdmin()">Close</button>';document.getElementById('admin').style.display='block'}function closeAdmin(){document.getElementById('admin').style.display='none'}function exportCSV(){var d=g();var csv='Timestamp,Category,Interesting
';for(var i=0;i<d.length;i++){csv+=d[i].timestamp+','+d[i].category+','+d[i].interesting+'
'}var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SHG_InnoTrans_Data.csv';a.click();}</script></body></html>
